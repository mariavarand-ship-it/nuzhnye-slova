<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Нужные слова — машинка добрых слов</title>

  <!-- SEO -->
  <meta name="description" content="Когда внутри шумно — нажми кнопку. Тёплые и странные слова поддержки прямо для тебя." />
  <meta name="keywords" content="поддержка, добрые слова, настроение, похвала, нужные слова" />

  <link rel="canonical" href="https://mariavarand-ship-it.github.io/nuzhnye-slova/" />

  <!-- Карточка при отправке ссылки в мессенджерах и соцсетях -->
  <meta property="og:title" content="Нужные слова" />
  <meta property="og:description" content="Когда внутри шумно — нажми кнопку. Тёплые и странные слова прямо для тебя." />
  <meta property="og:image" content="https://mariavarand-ship-it.github.io/nuzhnye-slova/og-image.png" />
  <meta property="og:url" content="https://mariavarand-ship-it.github.io/nuzhnye-slova/" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ru_RU" />
  <meta property="og:site_name" content="Нужные слова" />

  <!-- Карточка для Telegram и Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Нужные слова" />
  <meta name="twitter:description" content="Когда внутри шумно — нажми кнопку." />
  <meta name="twitter:image" content="https://mariavarand-ship-it.github.io/nuzhnye-slova/og-image.png" />

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Слова" />

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-EJDTVS77VQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-EJDTVS77VQ");
  </script>

  <!-- ===== OneSignal (push-уведомления) ===== -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function (OneSignal) {
      await OneSignal.init({
        appId: "9b7cd779-c7f9-44ba-b5f7-a1d010c3eb6c",
        serviceWorkerPath: "nuzhnye-slova/OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/nuzhnye-slova/" },
        autoResubscribe: true,
        promptOptions: { slidedown: { prompts: [] } }
      });
    });
  </script>
  <!-- ===== /OneSignal ===== -->

  <!-- ===== Стили для предложения имени ===== -->
  <style>
    .notify-wrap { margin: 10px 0; }
    .name-prompt {
      margin: 18px auto 6px;
      max-width: 340px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, .12);
    }
    .name-prompt-text {
      font-size: 14px;
      line-height: 1.45;
      color: rgba(255, 255, 255, .8);
      margin: 0 0 12px;
    }
    .name-prompt-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .name-prompt-row input {
      flex: 1;
      padding: 11px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .2);
      background: rgba(255, 255, 255, .06);
      color: #fff;
      font: inherit;
      font-size: 14px;
      outline: none;
    }
    .name-prompt-row input::placeholder { color: rgba(255, 255, 255, .45); }
    .name-prompt-save {
      flex: 0 0 auto;
      width: 46px;
      height: 44px;
      border-radius: 999px;
      background: #f1efe8;
      color: #111;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
    .name-prompt-later {
      margin-top: 10px;
      background: none;
      border: none;
      color: rgba(255, 255, 255, .5);
      text-decoration: underline;
      font: inherit;
      cursor: pointer;
    }
  </style>
  <!-- ===== /Стили ===== -->
</head>
<body>
  <main class="app">

    <!-- ===== Стартовый экран: символ + крючок + одна кнопка ===== -->
    <section id="nameScreen" class="screen">
      <div class="symbol">✦</div>
      <h1>Когда внутри шумно — нажми.</h1>
      <button class="button" id="startButton">Получить тёплые слова</button>
      <p class="footer">
        <span id="welcomeFooterPhrase">заходи, когда захочешь</span>
      </p>
    </section>

    <!-- ===== Главный экран ===== -->
    <section id="mainScreen" class="screen hidden">
      <button class="change-name" id="resetNameButton">добавить имя</button>
      <div id="emoji" class="symbol">✦</div>
      <div id="todayDate" class="today-date"></div>
      <div id="message" class="message">
        Нажми кнопку — и приложение скажет что-нибудь нужное.
      </div>
      <div class="phrase-actions">
        <button class="save-card-button is-hidden" id="saveImageButton">
          <span class="save-card-heart">♡</span>
          <span>сохранить</span>
        </button>
      </div>

      <!-- Мягкое предложение имени: появляется после первого тёплого слова, один раз -->
      <div id="namePrompt" class="name-prompt is-hidden">
        <p class="name-prompt-text">Хочешь, буду обращаться по имени? Так теплее 🤍</p>
        <div class="name-prompt-row">
          <input id="inlineNameInput" placeholder="Как тебя называла мама?" autocomplete="nickname" />
          <button class="name-prompt-save" id="inlineNameSave" aria-label="сохранить имя">→</button>
        </div>
        <button class="name-prompt-later" id="nameLaterButton">не сейчас</button>
      </div>

      <!-- Кнопка включения уведомлений -->
      <div class="notify-wrap">
        <button class="button notify-button is-hidden" id="notifyButton">
          🔔 Получать тёплые слова каждое утро
        </button>
      </div>

      <div class="buttons">
        <button class="button odd" id="moodButton">Поднять настроение</button>
        <button class="button even" id="wisdomButton">Совет дня</button>
        <button class="button odd" id="praiseButton">Похвалить</button>
      </div>
      <p class="footer">
        <span id="footerPhrase">заходи, когда захочешь</span>
        <span class="footer-dot">·</span>
        <a href="https://t.me/mashavarand" target="_blank" rel="noopener noreferrer" id="authorLink">
          написать автору
        </a>
      </p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
