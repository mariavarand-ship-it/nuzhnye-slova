<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Нужные слова</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="apple-touch-icon.png" />

  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Слова" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-EJDTVS77VQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());

    gtag("config", "G-EJDTVS77VQ");
  </script>
</head>

<body>
  <main class="app">
    <section id="nameScreen" class="screen">
      <div class="symbol">✦</div>

      <h1>Как тебя называла мама в детстве?</h1>

      <p>Это имя будет появляться в советах и похвале.</p>

      <input id="nameInput" placeholder="Например: Машенька" autocomplete="nickname" />

      <button class="button" id="saveNameButton">Продолжить</button>

      <p class="footer">
        <span id="welcomeFooterPhrase">заходи, когда захочешь</span>
      </p>
    </section>

    <section id="mainScreen" class="screen hidden">
      <button class="change-name" id="resetNameButton">сменить имя</button>

      <div id="emoji" class="symbol">✦</div>

      <div id="todayDate" class="today-date"></div>

      <div id="message" class="message">
        Нажми кнопку — и приложение скажет что-нибудь нужное.
      </div>

      <div class="phrase-actions">
        <button class="save-card-button is-hidden" id="saveImageButton">
          <span class="save-card-heart">♡</span>
          <span>сохранить</span>
        </button>
      </div>

      <div class="buttons">
        <button class="button odd" id="moodButton">Поднять настроение</button>
        <button class="button even" id="wisdomButton">Совет дня</button>
        <button class="button odd" id="praiseButton">Похвалить</button>
      </div>

      <p class="footer">
        <span id="footerPhrase">заходи, когда захочешь</span>
        <span class="footer-dot">·</span>
        <a href="https://t.me/mashavarand" target="_blank" rel="noopener noreferrer" id="authorLink">
          написать автору
        </a>
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
